name: Deploy to Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/542492384641/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'firebase-adminsdk-fbsvc@pragmavadesktopinfowebsite.iam.gserviceaccount.com'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: npm --prefix functions ci

      - name: Build Frontend
        run: npm run build
        env:
          # Injected into the build for the frontend to use
          VITE_API_BASE_URL: "https://us-central1-pragmavadesktopinfowebsite.cloudfunctions.net/api"

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: |
          # Deploy everything (Functions + Hosting + Firestore)
          firebase deploy --non-interactive --project pragmavadesktopinfowebsite
